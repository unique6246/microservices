spring:
  application:
    name: API-GATEWAY
  profiles:
    active: dev
  main:
    web-application-type: reactive

  # Spring Cloud Gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      filter:
        request-rate-limiter:
          deny-empty-key: false   # allow request if key cannot be resolved (e.g. Redis down)
      routes:

        # ── AccountService ───────────────────────────────────────────────────
        - id: ACCOUNT-SERVICE
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@remoteAddrKeyResolver}"
            - name: CircuitBreaker
              args:
                name: accountsCB
                fallbackUri: forward:/fallback/accounts

        # ── LoanService (AccountService) ─────────────────────────────────────
        - id: LOAN-SERVICE
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/v1/loans/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@remoteAddrKeyResolver}"
            - name: CircuitBreaker
              args:
                name: accountsCB
                fallbackUri: forward:/fallback/accounts

        # ── CustomerService ──────────────────────────────────────────────────
        - id: CUSTOMER-SERVICE
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@remoteAddrKeyResolver}"
            - name: CircuitBreaker
              args:
                name: customersCB
                fallbackUri: forward:/fallback/customers

        # ── KYC (CustomerService) ─────────────────────────────────────────────
        - id: KYC-SERVICE
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/kyc/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@remoteAddrKeyResolver}"
            - name: CircuitBreaker
              args:
                name: customersCB
                fallbackUri: forward:/fallback/customers

        # ── OTP (CustomerService) ─────────────────────────────────────────────
        - id: OTP-SERVICE
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/otp/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@remoteAddrKeyResolver}"
            - name: CircuitBreaker
              args:
                name: customersCB
                fallbackUri: forward:/fallback/customers

        # ── TransactionService ───────────────────────────────────────────────
        - id: TRANSACTION-SERVICE
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@remoteAddrKeyResolver}"
            - name: CircuitBreaker
              args:
                name: transactionsCB
                fallbackUri: forward:/fallback/transactions

        # ── NotificationService ──────────────────────────────────────────────
        - id: NOTIFICATION-SERVICE
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationsCB
                fallbackUri: forward:/fallback/notifications

  # Redis for rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}

  # JWT Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          # Replace with your actual JWKS URI or issuer
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000}
          # OR use a static public key for simple setups:
          # public-key-location: classpath:public.pem

# Eureka
eureka:
  instance:
    hostname: ${HOSTNAME:localhost}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

# Server
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URI:http://localhost:9411/api/v2/spans}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO
    com.example.apigateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev
  # Dev mode: JWT validated using a local HMAC-SHA256 secret.
  # Use POST /auth/token to get a signed token for testing.
  # The programmatic ReactiveJwtDecoder bean in SecurityConfig handles JWT validation — no issuer-uri needed.

# Force loopback registration so gateway itself also registers as 127.0.0.1
eureka:
  instance:
    ip-address: 127.0.0.1
    prefer-ip-address: true

# Full tracing in dev - Zipkin running via docker-compose-infra.yml
management:
  tracing:
    sampling:
      probability: 1.0

# Dev-only: symmetric secret used to sign & verify JWTs locally.
# Must be >= 32 characters (256-bit minimum for HS256).
app:
  jwt:
    secret: "dev-local-banking-secret-key-for-hs256-do-not-use-in-prod"

---
spring:
  config:
    activate:
      on-profile: prod

management:
  tracing:
    sampling:
      probability: 0.1

logging:
  level:
    root: WARN
    com.example.apigateway: INFO

