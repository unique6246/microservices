spring:
  application:
    name: TRANSACTION-SERVICE
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc.batch_size: 50
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    connection-timeout: 3000  # fail fast if RabbitMQ is unavailable

eureka:
  instance:
    hostname: ${HOSTNAME:localhost}
    prefer-ip-address: true
    health-check-url-path: /actuator/health
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

server:
  port: ${SERVER_PORT:8003}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URI:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

spring.cloud.openfeign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        register-health-indicator: true
      customerService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      accountService:
        max-attempts: 3
        wait-duration: 500ms
      customerService:
        max-attempts: 3
        wait-duration: 500ms
  timelimiter:
    instances:
      accountService:
        timeout-duration: 5s

account:
  queue:
    json:
      name: accountJsonQueue
  exchange:
    name: accountExchange
  routing:
    json:
      key: accountJsonRoutingKey

logging:
  level:
    root: INFO
    com.example.transactionservice: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] [%X{correlationId}] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/transaction_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASS:Pintu@1617}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
# Force loopback IP so gateway routes to 127.0.0.1 (not the machine's network IP)
eureka:
  instance:
    ip-address: 127.0.0.1
    prefer-ip-address: true

# Enable full tracing in dev - Zipkin running via docker-compose-infra.yml
management:
  tracing:
    sampling:
      probability: 1.0

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true

management:
  tracing:
    sampling:
      probability: 0.1

logging:
  level:
    root: WARN
    com.example.transactionservice: INFO
