server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Static assets — long-lived cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy all /api/* calls to the API Gateway
    location /api/ {
        proxy_pass         http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy /auth/* — JWT token issuance (dev /auth/token endpoint)
    location /auth/ {
        proxy_pass         http://api-gateway:8080/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 30s;
    }

    # Proxy /actuator/* — gateway health for dashboard
    location /actuator/ {
        proxy_pass         http://api-gateway:8080/actuator/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # SPA fallback — React Router catches all other paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}

