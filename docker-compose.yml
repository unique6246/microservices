version: "3.3"

# ─────────────────────────────────────────────────────────────────────────────
# Banking Microservices – Docker Compose
# Usage:
#   cp .env.example .env        # fill in secrets
#   docker-compose up --build -d
# ─────────────────────────────────────────────────────────────────────────────

networks:
  banking-net:
    driver: bridge

volumes:
  mysql-accounts-data:
  mysql-customer-data:
  mysql-transaction-data:
  mysql-notification-data:
  redis-data:

# ─── Infrastructure ───────────────────────────────────────────────────────────
services:

  # MySQL – Accounts DB
  mysql-accounts:
    image: mysql:8.0
    container_name: mysql-accounts
    environment:
      MYSQL_DATABASE: accounts_db
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mysql-accounts-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - banking-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MySQL – Customer DB
  mysql-customer:
    image: mysql:8.0
    container_name: mysql-customer
    environment:
      MYSQL_DATABASE: customer_db
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mysql-customer-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - banking-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MySQL – Transaction DB
  mysql-transaction:
    image: mysql:8.0
    container_name: mysql-transaction
    environment:
      MYSQL_DATABASE: transaction_db
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mysql-transaction-data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - banking-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MySQL – Notification DB
  mysql-notification:
    image: mysql:8.0
    container_name: mysql-notification
    environment:
      MYSQL_DATABASE: notification_db
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mysql-notification-data:/var/lib/mysql
    ports:
      - "3309:3306"
    networks:
      - banking-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    networks:
      - banking-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis (caching + rate limiting)
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASS}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - banking-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # Zipkin (distributed tracing)
  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - banking-net

# ─── Service Discovery ────────────────────────────────────────────────────────

  eureka-server:
    build:
      context: ./Eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8761:8761"
    networks:
      - banking-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ─── Business Services ────────────────────────────────────────────────────────

  account-service:
    build:
      context: ./Accountservices
      dockerfile: Dockerfile
    container_name: account-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8001
      DB_URL: jdbc:mysql://mysql-accounts:3306/accounts_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASS: ${DB_PASS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      REDIS_HOST: redis
      REDIS_PASS: ${REDIS_PASS}
      EUREKA_URI: http://eureka-server:8761/eureka/
      ZIPKIN_URI: http://zipkin:9411/api/v2/spans
    ports:
      - "8001:8001"
    depends_on:
      mysql-accounts:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - banking-net
    restart: unless-stopped

  customer-service:
    build:
      context: ./CoustomerServices
      dockerfile: Dockerfile
    container_name: customer-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8002
      DB_URL: jdbc:mysql://mysql-customer:3306/customer_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASS: ${DB_PASS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      REDIS_HOST: redis
      REDIS_PASS: ${REDIS_PASS}
      EUREKA_URI: http://eureka-server:8761/eureka/
      ZIPKIN_URI: http://zipkin:9411/api/v2/spans
    ports:
      - "8002:8002"
    depends_on:
      mysql-customer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - banking-net
    restart: unless-stopped

  transaction-service:
    build:
      context: ./TransactionService
      dockerfile: Dockerfile
    container_name: transaction-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8003
      DB_URL: jdbc:mysql://mysql-transaction:3306/transaction_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASS: ${DB_PASS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      EUREKA_URI: http://eureka-server:8761/eureka/
      ZIPKIN_URI: http://zipkin:9411/api/v2/spans
    ports:
      - "8003:8003"
    depends_on:
      mysql-transaction:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - banking-net
    restart: unless-stopped

  notification-service:
    build:
      context: ./Notification-Service
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8004
      DB_URL: jdbc:mysql://mysql-notification:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASS: ${DB_PASS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EUREKA_URI: http://eureka-server:8761/eureka/
      ZIPKIN_URI: http://zipkin:9411/api/v2/spans
    ports:
      - "8004:8004"
    depends_on:
      mysql-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - banking-net
    restart: unless-stopped

# ─── API Gateway ─────────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./Api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PASS: ${REDIS_PASS}
      EUREKA_URI: http://eureka-server:8761/eureka/
      ZIPKIN_URI: http://zipkin:9411/api/v2/spans
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - banking-net
    restart: unless-stopped

# ─── Banking UI ───────────────────────────────────────────────────────────────

  banking-ui:
    build:
      context: ./banking-ui
      dockerfile: Dockerfile
    container_name: banking-ui
    ports:
      - "3000:80"     # http://localhost:3000
    depends_on:
      - api-gateway
    networks:
      - banking-net
    restart: unless-stopped

