# ─────────────────────────────────────────────────────────────────────────────
# 01-secrets.yaml — Banking Microservices Kubernetes Secrets
#
# IMPORTANT: Fill in your actual values below before applying.
#            All values under stringData are plain-text (k8s will base64-encode them).
#
# Apply with:   kubectl apply -f k8s/01-secrets.yaml
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret
metadata:
  name: banking-secrets
  namespace: banking
type: Opaque
stringData:
  # MySQL root password (used by all 4 databases)
  DB_PASS: "changeme_strong_password"

  # RabbitMQ credentials
  RABBITMQ_USER: "bankinguser"
  RABBITMQ_PASS: "changeme_rabbitmq_pass"

  # Redis password
  REDIS_PASS: "changeme_redis_pass"

  # SMTP / Email (used by Notification Service)
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "your-email@gmail.com"
  SMTP_PASS: "your-app-password"

  # JWT Issuer URI (used by API Gateway for token validation)
  # Example for Keycloak: http://keycloak:8080/realms/banking
  # Leave as empty string to disable JWT validation in dev
  JWT_ISSUER_URI: ""

