# ─────────────────────────────────────────────────────────────────────────────
# API Gateway — Port 8080  (main external entry-point)
# Depends on: redis, eureka-server
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: banking
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-eureka
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              echo "Waiting for eureka-server:8761..."
              until timeout 5 nc -z eureka-server.banking.svc.cluster.local 8761 2>/dev/null; do echo "Eureka not ready, retrying in 5s..."; sleep 5; done
              echo "Eureka ready!"
        - name: wait-for-redis
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              echo "Waiting for redis:6379..."
              until timeout 5 nc -z redis.banking.svc.cluster.local 6379 2>/dev/null; do echo "Redis not ready, retrying in 5s..."; sleep 5; done
              echo "Redis ready!"
      containers:
        - name: api-gateway
          image: localhost:5000/banking/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: banking-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SERVER_PORT
              value: "8080"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: banking-config
                  key: REDIS_HOST
            - name: REDIS_PASS
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: REDIS_PASS
            - name: EUREKA_URI
              valueFrom:
                configMapKeyRef:
                  name: banking-config
                  key: EUREKA_URI
            - name: ZIPKIN_URI
              valueFrom:
                configMapKeyRef:
                  name: banking-config
                  key: ZIPKIN_URI
            - name: JWT_ISSUER_URI
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: JWT_ISSUER_URI
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 8
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
# Internal ClusterIP service
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: banking
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
# NodePort for external access — main API endpoint
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-np
  namespace: banking
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080   # Access via http://<VM_IP>:30080

