# ─────────────────────────────────────────────────────────────────────────────
# Ingress — Routes external HTTP traffic to API Gateway
# k3s ships with Traefik ingress controller out-of-the-box (no extra install)
# Access: http://<VM_IP>:80   or NodePort http://<VM_IP>:30080
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ingress
  namespace: banking
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
