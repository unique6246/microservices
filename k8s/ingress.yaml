# ─────────────────────────────────────────────────────────────────────────────
# Ingress — Routes external HTTP traffic to API Gateway
# Requires: nginx ingress controller  (installed by k3s Traefik OR nginx)
#
# For k3s Traefik ingress, this works out-of-the-box.
# For bare k8s: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/baremetal/deploy.yaml
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ingress
  namespace: banking
  annotations:
    # nginx ingress controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # For k3s Traefik, use these instead:
    # traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  # If you have a domain name or /etc/hosts entry for the VM IP, set it here.
  # Otherwise leave rules.host blank to match all hosts.
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

