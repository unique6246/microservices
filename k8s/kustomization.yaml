apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banking

resources:
  # ── Core Setup ────────────────────────────────────────────────────────────
  - 00-namespace.yaml
  - 01-secrets.yaml
  - 02-configmap.yaml

